plugins {
    id 'strategos.core-conventions'
}

repositories {
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net'
        content { includeGroup 'com.mojang' }
    }
}

dependencies {
    // Exactly what Minecraft 1.21.1 ships; provided by the game at runtime, never packaged.
    // DFU brings gson 2.10.1, guava 32.1.2-jre and jsr305 3.0.2 transitively: they are on the
    // compile classpath, and ArchUnit rule B1 bans their use in core code.
    mcShipped libs.fastutil
    mcShipped libs.dfu
    mcShipped libs.gson
    mcShipped libs.slf4j.api

    // [M1 T8] CrossingBench crosses the generated proving ground of the test kit.
    jmhImplementation testFixtures(project)

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.assertj
    testImplementation libs.archunit
    testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test', Test) {
    useJUnitPlatform { excludeTags 'soak', 'replay' }
    timeout = java.time.Duration.ofMinutes(5)
    // [M1 T6] ProvingGroundTest compares the generator with the committed map package of the mod's devtools.
    systemProperty 'strategos.repoRoot', rootDir.absolutePath
    inputs.files(rootProject.fileTree('mod/src/devtools/resources/data/strategos/strategos/maps'))
            .withPropertyName('mapManifests')
    // [M3 T2] DATA-04.2: BalanceSheetTest compares the sheet built from the mod's data with docs/balance.
    inputs.files(rootProject.fileTree('mod/src/main/resources/data')).withPropertyName('modData')
    inputs.files(rootProject.fileTree('docs/balance')).withPropertyName('balanceSheet')
}

// [M3 T2] DATA-04: writes docs/balance/sheet.md and sheet.csv from the mod's templates and balance data; fails on a
// template problem or a sheet problem (a number without provenance, a resource spent fewer than twice).
tasks.register('balanceSheet', JavaExec) {
    group = 'documentation'
    description = 'Regenerates docs/balance/sheet.md and sheet.csv from the mod data.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.strategos.core.testkit.BalanceData'
    args(rootProject.file('mod/src/main/resources/data').absolutePath, rootProject.file('docs/balance').absolutePath)
}

// [T6b] long seeded determinism runs; part of verify and of verifySoak, not verifyFast.
tasks.register('soak', Test) {
    group = 'verification'
    description = 'Seeded determinism soak: 200 seeds x 10,000 ticks.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'soak' }
    timeout = java.time.Duration.ofMinutes(10)
}

// [T6b] QA-02.4: the test kit also loads inside GameTests, so it must never depend on JUnit or AssertJ.
def fixtureDeps = configurations.named('testFixturesRuntimeClasspath').flatMap { it.incoming.artifacts.resolvedArtifacts }
        .map { set -> set.collect { it.id.componentIdentifier.displayName } }
tasks.register('checkTestFixturesDeps') {
    group = 'verification'
    description = 'Fails when core/testFixtures depends on JUnit or AssertJ.'
    inputs.property('dependencies', fixtureDeps)
    doLast {
        def banned = fixtureDeps.get().findAll { it.startsWith('org.junit') || it.startsWith('org.assertj') }
        if (banned) throw new GradleException("core/testFixtures must not depend on JUnit or AssertJ: ${banned}")
    }
}
tasks.named('check') { dependsOn 'checkTestFixturesDeps' }

// [T8] cross-level check: replay the journals the GameTests exported.
def journalsDir = rootProject.file('mod/build/gametest/journals')
tasks.register('replayJournals', Test) {
    group = 'verification'
    description = 'Replays every GameTest journal in plain JUnit and compares the state hash.'
    dependsOn ':mod:runGameTestServer'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'replay' }
    systemProperty 'strategos.journals.dir', journalsDir.absolutePath
    outputs.upToDateWhen { false }
    doFirst {
        def found = journalsDir.listFiles({ File f -> f.name.endsWith('.strj') } as FileFilter)
        if (found == null || found.length == 0) throw new GradleException("No GameTest journals in ${journalsDir}")
    }
}

// [M1 T1] CORE-11.3: records the golden journals again from their scenarios; the reason is mandatory and is appended
// to src/test/resources/journals/REBASELINE.md with the date and the names.
def journalsResourceDir = file('src/test/resources/journals')
tasks.register('rebaselineJournals', JavaExec) {
    group = 'verification'
    description = 'Re-records the golden journals; -Preason="why the hashes changed" is required.'
    classpath = sourceSets.test.runtimeClasspath   // the test classpath carries the game's libraries (mcShipped)
    mainClass = 'dev.strategos.core.testkit.GoldenJournals'
    def reason = providers.gradleProperty('reason')
    args(journalsResourceDir.absolutePath, reason.getOrElse(''))
    doFirst {
        if (!reason.isPresent() || reason.get().isBlank()) {
            throw new GradleException('rebaselineJournals needs -Preason="why the golden hashes changed"')
        }
    }
}

// [T12] JMH regression gate against the owner-approved baseline of this machine, plus the
// allocation check of the @HotPath kernels. A static method keeps the configuration cache happy.
class JmhGate {
    static final double LIMIT = 1.15d                 // 15 % (QA-07.1)
    static final double MAX_KERNEL_BYTES = 1.0d        // a non-allocating kernel reports a fraction of a byte per op
    // JMH's own threads allocate about 7 KB/s, which -prof gc counts in every op, so a long op shows a few bytes of it
    // (M1 T21: 1.8 B over a 264 µs step, the same rate in every benchmark). A kernel may report twice that rate over
    // its op, when that is more than the fixed byte.
    static final double BACKGROUND_BYTES_PER_SECOND = 14_000d
    static final Map<String, Double> SECONDS_PER_UNIT = ['ns/op': 1e-9d, 'us/op': 1e-6d, 'ms/op': 1e-3d, 's/op': 1d]
    // QA-07.4 as the owner settled it (2026-10-23): a kernel allocates nothing per unit per tick, but an event it
    // announces may cost a message. OrcaBench's crossing stalls units long enough for the stuck ladder's first rungs:
    // about 0.3 events a step, each a PathInvalidated and a Stuck record, 7.3 B a step at M1's close. The bytes a
    // kernel's events may cost per op; an allocation-free bus would bring them back to the rule.
    static final Map<String, Double> EVENT_BYTES = ['OrcaBench.step600': 16d]

    static List<String> problems(File result, File baseline, List<String> kernels) {
        def slurper = new groovy.json.JsonSlurper()
        def key = { r -> r.benchmark + (r.params ? r.params.toString() : '') }
        def base = slurper.parse(baseline).collectEntries { [(key(it)): it] }
        def problems = []
        slurper.parse(result).each { r ->
            def b = base[key(r)]
            if (b != null) {
                double now = r.primaryMetric.score as double
                double was = b.primaryMetric.score as double
                boolean lowerIsBetter = r.mode in ['avgt', 'sample', 'ss']
                boolean worse = lowerIsBetter ? now > was * LIMIT : now < was / LIMIT
                if (worse) problems << String.format('%s: %.3f -> %.3f %s, a regression above 15 %%', key(r), was, now, r.primaryMetric.scoreUnit)
            }
            if (kernels.any { r.benchmark.endsWith(it) }) {   // QA-07.4: 0 B/op for @HotPath kernels
                def norm = r.secondaryMetrics?.find { k, v -> k.endsWith('gc.alloc.rate.norm') }?.value
                if (norm == null) problems << "${key(r)}: no gc.alloc.rate.norm; run JMH with -prof gc"
                else {
                    double seconds = (r.primaryMetric.score as double) * (SECONDS_PER_UNIT[r.primaryMetric.scoreUnit] ?: 0d)
                    double events = EVENT_BYTES.find { k, v -> r.benchmark.endsWith(k) }?.value ?: 0d
                    double allowed = Math.max(MAX_KERNEL_BYTES, seconds * BACKGROUND_BYTES_PER_SECOND) + events
                    if ((norm.score as double) > allowed) problems << String.format('%s: a @HotPath kernel allocates %.1f B/op (%.1f allowed for JMH\'s own background)', key(r), norm.score as double, allowed)
                }
            }
        }
        problems
    }

    // A benchmark whose set-up throws is skipped and the run still succeeds, so a missing result is a failure of its
    // own: MotionBench and OrcaBench were missing from M1 T22 to M1's close unnoticed.
    static List<String> missing(File result, File baseline, List<String> kernels) {
        def slurper = new groovy.json.JsonSlurper()
        def key = { r -> r.benchmark + (r.params ? r.params.toString() : '') }
        def results = slurper.parse(result)
        def ran = results.collect { key(it) } as Set
        def problems = []
        slurper.parse(baseline).each { b ->
            if (!ran.contains(key(b))) problems << "${key(b)}: in the baseline but not in the result (did its set-up throw?)"
        }
        kernels.each { k ->
            if (!results.any { it.benchmark.endsWith(k) }) problems << "${k}: a @HotPath kernel missing from the result (did its set-up throw?)"
        }
        problems
    }
}

// The benchmarks of @HotPath kernels; each must report no allocation per operation.
def hotPathKernels = ['StateHashBench.hash600', 'MotionBench.step600', 'OrcaBench.step600', 'StatReadBench.cachedRead', 'SpatialBench.rebuild1000']
// -Pjmh.result and -Pjmh.baseline are paths relative to the repository root.
def jmhResultFile = rootProject.file(providers.gradleProperty('jmh.result')
        .getOrElse(layout.buildDirectory.file('reports/jmh/result.json').get().asFile.path))
def jmhBaselineFile = rootProject.file(providers.gradleProperty('jmh.baseline')
        .getOrElse("perf/baseline-${providers.gradleProperty('perf.machine').getOrElse('m4pro')}.json"))
tasks.register('jmhCompare') {
    group = 'verification'
    description = 'Fails when a JMH score regresses by more than 15 % against the approved baseline, or a @HotPath kernel allocates.'
    mustRunAfter 'jmh'
    doLast {
        if (!jmhBaselineFile.isFile()) {
            throw new GradleException("No approved JMH baseline at ${jmhBaselineFile}. Show ${jmhResultFile} to the owner; copy it there only after approval.")
        }
        if (!jmhResultFile.isFile()) throw new GradleException("No JMH result at ${jmhResultFile}; run :core:jmh first.")
        def problems = JmhGate.problems(jmhResultFile, jmhBaselineFile, hotPathKernels)
                + JmhGate.missing(jmhResultFile, jmhBaselineFile, hotPathKernels)
        if (problems) throw new GradleException('JMH gate:\n  ' + problems.join('\n  '))
    }
}

// [T12] verifyHarness: the gate must catch a 30 % slowdown and an allocating kernel in the fixed
// self-test files, without timing noise (QA-07.1, QA-07.4); [T21] a long kernel that allocates is caught too, and one
// that shows only JMH's background passes.
def jmhSelftestDir = file('src/jmh/resources/selftest')
tasks.register('jmhSelftest') {
    group = 'verification'
    description = 'Proves the JMH gate bites: a 30 % slowdown, an allocating @HotPath kernel and a missing benchmark.'
    doLast {
        def baseline = new File(jmhSelftestDir, 'baseline.json')
        def slow = JmhGate.problems(new File(jmhSelftestDir, 'slow-result.json'), baseline, [])
        def kernels = ['Selftest.kernel', 'Selftest.longKernel']
        def alloc = JmhGate.problems(new File(jmhSelftestDir, 'alloc-result.json'), baseline, kernels)
        def background = JmhGate.problems(new File(jmhSelftestDir, 'background-result.json'), baseline, kernels)
        if (!slow.any { it.contains('regression') }) throw new GradleException('The JMH gate no longer catches a 30 % slowdown')
        if (alloc.count { it.contains('allocates') } != 2) throw new GradleException('The JMH gate no longer catches an allocating @HotPath kernel, short and long: ' + alloc)
        if (!background.isEmpty()) throw new GradleException('The JMH gate takes JMH\'s own background for a kernel\'s allocation: ' + background)
        def missing = JmhGate.missing(new File(jmhSelftestDir, 'slow-result.json'), baseline, ['Selftest.kernel'])
        if (!missing.any { it.contains('Selftest.kernel') }) throw new GradleException('The JMH gate no longer catches a benchmark missing from the result: ' + missing)
    }
}

// [T18] CI only: the CI-to-M4 Pro speed ratio, the geometric mean over every benchmark both files
// share; CI's slow-host factor for budget C (QA-08).
def m4proBaseline = rootProject.file('perf/baseline-m4pro.json')
def speedRatioFile = layout.buildDirectory.file('reports/perf/speed-ratio.json').get().asFile
tasks.register('jmhSpeedRatio') {
    group = 'verification'
    description = 'Writes the ratio of this machine\'s JMH scores to the approved M4 Pro baseline.'
    mustRunAfter 'jmh'
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def key = { r -> r.benchmark + (r.params ? r.params.toString() : '') }
        def base = slurper.parse(m4proBaseline).collectEntries { [(key(it)): it.primaryMetric.score as double] }
        def logs = slurper.parse(jmhResultFile).findAll { base[key(it)] }
                .collect { Math.log((it.primaryMetric.score as double) / base[key(it)]) }
        if (logs.isEmpty()) throw new GradleException("No benchmark shared with ${m4proBaseline}")
        speedRatioFile.parentFile.mkdirs()
        speedRatioFile.text = groovy.json.JsonOutput.toJson([ratio: Math.exp(logs.sum() / logs.size()), benchmarks: logs.size()])
    }
}
