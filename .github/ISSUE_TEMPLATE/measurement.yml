name: Benchmark or platform report
description: Results of the benchmarks or tests on your machine — every baseline so far is one Mac.
labels: [platform]
body:
  - type: input
    id: machine
    attributes:
      label: Machine
      description: OS and version, CPU and cores, RAM, GPU, Java version.
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: The commands you ran (e.g. ./gradlew verify, :core:jmh) and their output or a gist link.
    validations:
      required: true
