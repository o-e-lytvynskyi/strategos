name: Bug report
description: Something in the mod or the build does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, a seed, a scenario id — whatever makes it happen again.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and version, CPU, GPU, Java version; Windows is untested so far, reports are welcome.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
