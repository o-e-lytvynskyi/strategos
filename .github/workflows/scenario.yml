# L4 on Linux under Xvfb and Mesa (S3's container route, QA-06): one client scenario, by hand. No window opens
# on anyone's screen, so it needs no consent. Actions are pinned to the commit of the tag in the comment.
name: scenario

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'smoke, world_switch, s4_units or stall'
        required: true
        default: 'smoke'

concurrency:
  group: scenario-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenario:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: scenario
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: >-
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset"
          ./gradlew --console=plain :mod:runScenario -Pscenario="$SCENARIO"
      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-out
          retention-days: 7
          if-no-files-found: ignore
          path: |
            mod/build/scenario/out/
            mod/build/scenario/logs/
            mod/build/scenario/crash-reports/
