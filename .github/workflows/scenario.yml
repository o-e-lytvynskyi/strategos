# L4 on Linux under Xvfb and Mesa (S3's container route, QA-06): one client scenario, by hand. No window opens
# on anyone's screen, so it needs no consent. The run's frames are compared with the linux-llvmpipe goldens
# (scenarioDiff, QA-18), and where there are goldens a copy with a square inverted must fail the diff
# (QA-18.2). Actions are pinned to the commit of the tag in the comment.
name: scenario

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'smoke, world_switch, s4_units, s10_steps, rts_basics, rts_select, rts_goldens or stall'
        required: true
        default: 'smoke'
      goldens:
        description: 'the goldens tree: mod/src/devtools/goldens, or mod/src/devtools/goldens-proposed to try proposals before approval'
        required: true
        default: 'mod/src/devtools/goldens'

concurrency:
  group: scenario-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenario:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: scenario
        env:
          SCENARIO: ${{ inputs.scenario }}
          GOLDENS: ${{ inputs.goldens }}
        run: >-
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX +render -noreset"
          ./gradlew --console=plain :mod:runScenario -Pscenario="$SCENARIO" -Pgoldens.root="$PWD/$GOLDENS"
      - name: An altered golden fails the diff
        env:
          SCENARIO: ${{ inputs.scenario }}
          GOLDENS: ${{ inputs.goldens }}
        run: |
          goldens="$GOLDENS/linux-llvmpipe/$SCENARIO"
          if [ ! -d "$goldens" ]; then echo "no linux-llvmpipe goldens for $SCENARIO"; exit 0; fi
          altered="$RUNNER_TEMP/altered"
          mkdir -p "$altered/linux-llvmpipe" && cp -R "$goldens" "$altered/linux-llvmpipe/"
          python3 tools/alter_golden.py "$altered"
          if ./gradlew --console=plain :mod:scenarioDiff -Pscenario="$SCENARIO" -Pgoldens.root="$altered"; then
            echo "scenarioDiff passed an altered golden"; exit 1
          fi
      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scenario-out
          retention-days: 7
          if-no-files-found: ignore
          path: |
            mod/build/scenario/out/
            mod/build/scenario/diff/
            mod/build/scenario/logs/
            mod/build/scenario/crash-reports/
