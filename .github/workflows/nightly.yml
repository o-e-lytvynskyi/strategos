# The slow GameTest batch and the determinism soak on Linux (M4 T12: moved out of the commit gate, which had grown
# past its 20 minutes). Since 2026-10-25 it no longer runs nightly: a maintainer starts it on a hand-in pull request
# by adding the label `full-ci` (or by hand), so it runs once per reviewed milestone. The file keeps its old name.
# Actions are pinned to the commit of the tag in the comment.
name: full-ci

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      paired_slow:
        description: 'Temporary M7 matched server control/candidate diagnosis'
        type: boolean
        default: false

concurrency:
  group: full-ci-${{ github.event.pull_request.number || github.ref }}-${{ inputs.paired_slow && 'paired' || 'standard' }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  nightly:
    if: (github.event_name == 'workflow_dispatch' && !inputs.paired_slow) || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # Preserve machine-load evidence even when the server times out before producing its final XML report.
      - name: slow and soak
        run: |
          mkdir -p build/reports/cloud-load
          vmstat -w 1 > build/reports/cloud-load/vmstat.txt &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          ./gradlew --console=plain --max-workers=2 verifySlow verifySoak
      - name: Test results (L1, L2, L3, L5)
        if: always()
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'nightly: test results'
          require_tests: true
      - name: Reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            **/build/test-results/
            **/build/reports/
            mod/build/gametest/logs/
            mod/build/gametest-slow/logs/
            mod/build/server-smoke/logs/
            mod/build/server-smoke/crash-reports/
            mod/build/harness/*/logs/

  paired-slow:
    if: github.event_name == 'workflow_dispatch' && inputs.paired_slow
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8111c0a4f68190e437b9d2aa5ec4178074110e2f
          path: control
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Record environment and build both before measuring
        run: |
          mkdir -p evidence
          lscpu > evidence/cpu.txt
          git -C control rev-parse HEAD > evidence/control.txt
          git -C candidate rev-parse HEAD > evidence/candidate.txt
          ./control/gradlew -p control --console=plain --max-workers=2 :mod:compileGametestJava :mod:prepareGameTestSlowRun
          ./candidate/gradlew -p candidate --console=plain --max-workers=2 :mod:compileGametestJava :mod:prepareGameTestSlowRun
      - name: Control server slow unchanged
        continue-on-error: true
        run: |
          vmstat -w 1 > evidence/control-vmstat.txt &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          set +e
          ./control/gradlew -p control --console=plain --max-workers=2 :mod:runGameTestSlow > evidence/control-run.txt 2>&1
          status=$?
          echo "$status" > evidence/control-status.txt
          tail -n 18 evidence/control-run.txt
          exit "$status"
      - name: Candidate server slow unchanged
        continue-on-error: true
        run: |
          vmstat -w 1 > evidence/candidate-vmstat.txt &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          set +e
          ./candidate/gradlew -p candidate --console=plain --max-workers=2 :mod:runGameTestSlow > evidence/candidate-run.txt 2>&1
          status=$?
          echo "$status" > evidence/candidate-status.txt
          tail -n 18 evidence/candidate-run.txt
          exit "$status"
      - name: Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paired-slow-reports
          retention-days: 7
          path: |
            evidence/
            control/mod/build/test-results/gametest-slow/
            candidate/mod/build/test-results/gametest-slow/
            control/mod/build/gametest-slow/logs/
            candidate/mod/build/gametest-slow/logs/
      - name: Preserve both gate verdicts
        if: always()
        run: |
          test "$(cat evidence/control-status.txt)" = 0
          test "$(cat evidence/candidate-status.txt)" = 0
