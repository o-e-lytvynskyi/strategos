# The Gradle dependency graph of main (2026-10-29): dependency review compares a pull request's graph with its base's,
# and without a graph for main every dependency, the game's pinned ones included, counted as added. With it, a pull
# request is checked only for the dependencies it adds or changes. Runs on each push to main; it builds the graph,
# no tests. Actions are pinned to the commit of the tag in the comment.
name: dependency-graph

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    # Dependency review, which reads this graph, runs only while the repository is public.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
