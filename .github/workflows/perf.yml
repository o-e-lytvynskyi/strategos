# L6 on Linux (M0 T12 and T18, QA-08): JMH and the CI-to-M4 Pro speed ratio, then the perf GameTests at
# 3x the budgets. Nightly and by hand, in its own concurrency group, so pushes neither pay for it nor
# cancel it. Actions are pinned to the commit of the tag in the comment.
name: perf

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # Shared runners are slower and noisier than the M4 Pro: no jmhCompare here, only the speed ratio,
      # and the perf GameTests at three times the budgets. The crowd soak is paced at 20 ticks a second, so
      # here it runs its first 2,400 ticks, two minutes; the full ten run locally in verifyPerf (M1 T26).
      - name: perf
        run: ./gradlew --console=plain --max-workers=2 :core:jmh :core:jmhSpeedRatio :mod:runGameTestPerf -Pperf.ciFactor=3 -Psoak.ticks=2400
      - name: Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            core/build/reports/jmh/
            core/build/reports/perf/
            mod/build/reports/perf/
            mod/build/gametest-perf/logs/
