# The hand-in gate on Linux (M0 T18, QA-08). Since 2026-10-25 CI runs on pull requests to main only, never on
# pushes: tests during a milestone are local, and a hand-in pull request (not a draft) is where CI checks the work, so
# no contributor's branch pushes spend the runner minutes. Actions are pinned to the commit of the tag in the comment.
name: verify

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md', '.claude/**', 'tools/**']
  workflow_dispatch:

# A newer push to the same pull request cancels the older run.
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    # M4 grew verify past 20 minutes with the slow batch and the soak in it; those run nightly now (nightly.yml)
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # Two workers: the runner has 2 cores and 7 GB, and every GameTest or smoke run is a server JVM.
      - name: verify
        run: ./gradlew --console=plain --max-workers=2 verify
      - name: Test results (L1, L2, L3, L5)
        if: always()
        # A fork's token cannot write checks; the artifact below still carries the reports.
        continue-on-error: ${{ github.event.pull_request.head.repo.fork == true }}
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: 'verify: test results'
          require_tests: true
      - name: Reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-reports
          retention-days: 7
          if-no-files-found: ignore
          path: |
            **/build/test-results/
            **/build/reports/
            mod/build/gametest/logs/
            mod/build/server-smoke/logs/
            mod/build/server-smoke/crash-reports/
            mod/build/harness/*/logs/
