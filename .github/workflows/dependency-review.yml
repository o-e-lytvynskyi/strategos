# Supply-chain check on pull requests that change dependencies or workflows (2026-10-25): the Gradle dependency graph
# is submitted, then dependency review fails the run on a known vulnerability or a licence outside the allowed list.
# GitHub offers dependency review free to public repositories only, so the job is skipped while the repository is
# private. Actions are pinned to the commit of the tag in the comment.
name: dependency-review

on:
  pull_request:
    branches: [main]
    paths: ['gradle/**', '**/*.gradle', 'build-logic/**', 'gradle.properties', '.github/workflows/**']

permissions:
  contents: write
  pull-requests: read

jobs:
  review:
    # A fork's token cannot submit the graph; fork pull requests touching dependencies get the owner's review instead
    # (CODEOWNERS) and the maintainer's dependency check (strategos-maintain §4).
    if: github.event.repository.private == false && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          retry-on-snapshot-warnings: true
          allow-licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, EPL-2.0, LGPL-2.1-only, LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, MPL-2.0, CC0-1.0, ISC
