// [M2 T8] QA-18: every scenario run's frames against the goldens of its platform and scenario,
// src/devtools/goldens/<platform>/<scenario>/ (the platform from result.json; -Pgoldens.root= another
// tree, as CI's altered-golden check uses). The shrunk frames land in build/scenario/diff/candidates/,
// a golden that differs fails the build with its difference image beside them; a scenario with no
// goldens yet only leaves candidates. Goldens change only with the owner's approval (devtools README).
def goldensRoot = providers.gradleProperty('goldens.root').map { new File(it) }.getOrElse(file('src/devtools/goldens'))
def scenarioDiffDir = file('build/scenario/diff')
def scenarioName = providers.gradleProperty('scenario').orElse('smoke')
tasks.register('scenarioDiff') {
    group = 'verification'
    description = 'Compares the last scenario run\'s frames with the goldens of its platform (QA-18).'
    def out = scenarioOut
    def root = goldensRoot
    def diff = scenarioDiffDir
    def name = scenarioName
    onlyIf { new File(out, 'result.json').isFile() }
    doLast {
        def result = new groovy.json.JsonSlurper().parse(new File(out, 'result.json'))
        // [M4 T3] the candidates are the last run's, whatever -Pscenario says: refuse another scenario's
        if (result.scenario != name.get()) throw new GradleException("The last run was ${result.scenario}, not ${name.get()}: run it first")
        def goldens = new File(root, "${result.platform}/${name.get()}")
        def report = ScenarioDiff.compare(out, goldens, diff)
        new File(diff, 'report.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(report)) + '\n'
        if (!goldens.isDirectory()) {
            logger.lifecycle("scenarioDiff: no goldens for ${name.get()} on ${result.platform}; candidates in ${diff}/candidates")
        }
        report.frames.each { logger.lifecycle("scenarioDiff: ${it.frame} nmse ${it.nmse} (threshold ${it.threshold})") }
        if (report.problems) {
            throw new GradleException("Goldens differ (${goldens}):\n  " + report.problems.join('\n  ') + "\nSee ${diff}")
        }
    }
}

// Copies the last run's candidates over its goldens. Only on the owner's word (QA-18.4).
tasks.register('approveGoldens') {
    group = 'verification'
    description = 'Makes the last scenario run\'s candidates its platform\'s goldens; only with the owner\'s approval.'
    def out = scenarioOut
    def root = goldensRoot
    def diff = scenarioDiffDir
    def name = scenarioName
    doLast {
        def result = new groovy.json.JsonSlurper().parse(new File(out, 'result.json'))
        def goldens = new File(root, "${result.platform}/${name.get()}")
        goldens.mkdirs()
        new File(diff, 'candidates').listFiles().findAll { it.name.endsWith('.png') }.each { File f ->
            java.nio.file.Files.copy(f.toPath(), new File(goldens, f.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            logger.lifecycle("approveGoldens: ${goldens.name}/${f.name}")
        }
    }
}

// [M2 T8] verifyHarness: the diff must pass a golden's own frame, a frame changed only under its mask
// and one with a little noise, and fail a changed frame and a missing one (QA-18.2's mechanism).
def diffSelftest = rootProject.file('gradle/selftest/goldens')
tasks.register('checkScenarioDiffSelftest') {
    group = 'verification'
    description = 'Proves scenarioDiff bites: a changed frame and a missing frame fail; noise and masked changes pass.'
    def fixtures = diffSelftest
    def work = file('build/harness/scenario-diff')
    doLast {
        def golden = new File(fixtures, 'golden')
        ['same': false, 'noise': false, 'masked': false, 'changed': true, 'missing': true].each { String run, boolean fails ->
            def report = ScenarioDiff.compare(new File(fixtures, run), golden, new File(work, run))
            if (!report.problems.isEmpty() != fails) {
                throw new GradleException("scenarioDiff ${fails ? 'passed' : 'failed'} the '${run}' run: ${report}")
            }
        }
        // M5 T1: identical pixels must not hide a failed scene assertion.
        [[ok: true], [ok: false, failures: ['selection did not change']], [:]].eachWithIndex { Map result, int i ->
            def scene = new File(work, "scene-${i}")
            scene.mkdirs()
            new File(fixtures, 'same').listFiles().each { File frame ->
                java.nio.file.Files.copy(frame.toPath(), new File(scene, frame.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
            new File(scene, 'result.json').text = groovy.json.JsonOutput.toJson(result)
            [golden, new File(work, 'no-goldens')].each { File expected ->
                def report = ScenarioDiff.compare(scene, expected, new File(work, "scene-diff-${i}-${expected.name}"))
                boolean failed = !report.problems.isEmpty()
                if (failed != (i != 0)) throw new GradleException("scenarioDiff accepted an invalid scene result: ${result}")
            }
        }
    }
}

// [T3] verifyHarness. These runs feed a guard its broken input and pass only when that guard would
// have failed, so a guard that stops biting fails the build (QA-04.1, QA-04.2, QA-04.4, QA-04.5,
// QA-05.3). A generator rejection leaves no report either: the server never starts (§7.4).
def expectNoReport = { String runTask, File dir, String what, String named ->
    tasks.matching { it.name == runTask }.configureEach {
        ignoreExitValue = true                          // RunGameTask extends JavaExec
        timeout = Duration.ofMinutes(5)
        mustRunAfter 'runGameTestServer'                // keeps the measured L3 wall time clean
        doFirst { dir.deleteDir(); dir.mkdirs() }
        doLast {
            def report = new File(dir, 'TEST-gametest.xml')
            boolean caught = !report.isFile() ||
                    new groovy.xml.XmlSlurper().parse(report).depthFirst().findAll { it.name() == 'testcase' }.isEmpty()
            if (!caught) throw new GradleException("verifyHarness: ${runTask} wrote a report; the GameTest guard no longer catches ${what}")
            // A rejection must also name the rejected test in the log.
            def log = new File(dir, 'logs/latest.log')
            if (named != null && !(log.isFile() && log.text.contains(named))) {
                throw new GradleException("verifyHarness: ${runTask} did not name ${named}; the generator no longer rejects ${what}")
            }
        }
    }
}
expectNoReport('runGameTestEmptyFilter', file('build/harness/empty-filter'), 'an empty test set', null)
expectNoReport('runGameTestBrokenLoad', file('build/harness/broken-load'), 'a mod-loading error', null)
expectNoReport('runGameTestRetryNoReason', file('build/harness/retry-no-reason'), 'a retry without a reason',
        'retrynoreasonselftest.no_reason')
expectNoReport('runGameTestSharedBatch', file('build/harness/shared-batch'), 'a solo test in a shared batch',
        'sharedbatchselftest.')

// [T3] verifyHarness. The self-tests that report pass only when their report shows the designed verdicts:
// the retry semantics with the retry list (QA-04.4) and, from T7c, the batch-end check (QA-04.6).
def expectVerdicts = { String runTask, File dir, List<String> passed, List<String> failed, String retried ->
    tasks.matching { it.name == runTask }.configureEach {
        ignoreExitValue = true                          // a failed required test makes the server exit non-zero
        timeout = Duration.ofMinutes(5)
        mustRunAfter 'runGameTestServer'
        doFirst { dir.deleteDir(); dir.mkdirs() }
        doLast {
            def report = new File(dir, 'TEST-gametest.xml')
            if (!report.isFile()) throw new GradleException("verifyHarness: ${runTask} wrote no report: ${report}")
            def xml = new groovy.xml.XmlSlurper().parse(report)
            def ok = xml.depthFirst().findAll { it.name() == 'testcase' }
                    .collectEntries { [("${it.@classname}.${it.@name}".toString()): it.failure.isEmpty()] }
            def wrong = passed.findAll { ok[it] != true }.collect { "${it} should pass" } +
                    failed.findAll { ok[it] != false }.collect { "${it} should fail" }
            def listed = xml.depthFirst().findAll { it.name() == 'property' && it.@name == 'retried' }
                    .collect { it.@value.toString() }
            if (retried != null && !listed.any { it.startsWith("${retried}: ") && it.contains(' attempts; ') && !it.endsWith('; ') }) {
                wrong << "${retried} listed as retried with its reason"
            }
            if (wrong) throw new GradleException("verifyHarness: ${runTask} no longer shows its designed verdicts: ${wrong}")
        }
    }
}
expectVerdicts('runGameTestRetry', file('build/harness/retry'),
        ['selftests.two_of_three'], ['selftests.exhausted'], 'selftests.two_of_three')
